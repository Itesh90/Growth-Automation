version: '3.8'

services:
  # Main application
  app:
    build: .
    container_name: headline-optimizer-app
    ports:
      - "8000:8000"
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/headline_optimizer
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - headline-optimizer-network

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: headline-optimizer-db
    environment:
      - POSTGRES_DB=headline_optimizer
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - headline-optimizer-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: headline-optimizer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - headline-optimizer-network

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: headline-optimizer-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - headline-optimizer-network

  # Streamlit dashboard
  dashboard:
    build: .
    container_name: headline-optimizer-dashboard
    command: ["streamlit", "run", "app/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/headline_optimizer
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - headline-optimizer-network

volumes:
  postgres_data:
  redis_data:

networks:
  headline-optimizer-network:
    driver: bridge
